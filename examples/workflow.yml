# Codorna Card: copie este arquivo para .github/workflows/codorna-card.yml
# no repositório do seu perfil (o que tem o mesmo nome do seu usuário).
# Copy this file to .github/workflows/codorna-card.yml in your profile repository.
name: Codorna Card

on:
  schedule:
    - cron: '23 4 * * *' # todo dia às 04:23 UTC / every day at 04:23 UTC
  workflow_dispatch: # botão "Run workflow" / manual run

permissions:
  contents: write # para comitar o SVG / to commit the SVG

concurrency:
  group: codorna-card
  cancel-in-progress: false

jobs:
  codorna-card:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: GabrielKoglin/codorna-card@v1
        # Tudo opcional / everything is optional:
        # with:
        #   theme: both          # dark | light | both
        #   lang: en             # pt-BR | en
        #   output: codorna-card.svg
        #   username: outro-login
        #   private-contributions: true  # soma o total de privadas do perfil / adds your private total
        #   # Modo completo: conta seus repositórios privados com um token só de leitura (veja o README).
        #   # Full mode: counts your private repositories with a read-only token (see the README).
        #   private-token: ${{ secrets.CODORNA_TOKEN }}
