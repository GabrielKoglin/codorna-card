name: Página de instalação

# Publica a página "Instalar o Codorna Card" (site/) no GitHub Pages.
# Em Settings → Pages, a origem precisa ser "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/install/**'
      - 'src/types.ts'
      - 'examples/iniciante-*-pt-BR.svg'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run site:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
