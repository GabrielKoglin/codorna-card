name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      - name: dist/ está atualizado?
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::dist/ está desatualizado. Rode 'npm run build' e comite o resultado."
            git status --porcelain -- dist
            git diff --stat -- dist
            exit 1
          fi

      - name: Exemplos e assets estão atualizados?
        run: |
          npm run demo
          npm run assets
          if [ -n "$(git status --porcelain -- examples assets)" ]; then
            echo "::error::examples/ ou assets/ está desatualizado. Rode 'npm run demo' e 'npm run assets' e comite o resultado."
            git status --porcelain -- examples assets
            exit 1
          fi
